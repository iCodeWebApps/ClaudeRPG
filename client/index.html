<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClaudeRPG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }
    #hud {
      position: fixed;
      top: 12px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      font-family: monospace;
      font-size: 12px;
    }
    #status { color: #aaa; }
    #status.connected { color: #4ade80; }
    #fs-btn {
      color: #aaa;
      cursor: pointer;
      user-select: none;
      line-height: 1;
      font-size: 14px;
      opacity: 0.6;
      transition: opacity 0.15s;
    }
    #fs-btn:hover { opacity: 1; }
  </style>
</head>
<body>
  <div id="hud">
    <span id="fs-btn" title="Toggle borderless fullscreen">⛶</span>
    <div id="status">● connecting...</div>
  </div>
  <script>
    const fsBtn = document.getElementById('fs-btn');
    const isPopup = new URLSearchParams(location.search).has('popup');

    if (isPopup) {
      fsBtn.textContent = '✕';
      fsBtn.title = 'Close borderless window';
    }

    fsBtn.addEventListener('click', () => {
      if (isPopup) {
        window.close();
        return;
      }
      const features = [
        `width=${window.outerWidth}`,
        `height=${window.outerHeight}`,
        `left=${window.screenX}`,
        `top=${window.screenY}`,
        'popup'
      ].join(',');
      window.open(location.pathname + '?popup=1', 'clauderpg-borderless', features);
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
