<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClaudeRPG</title>
  <link rel="icon" type="image/png" href="assets/chicken.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: monospace;
    }
    #hud {
      position: fixed;
      top: 12px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      font-family: monospace;
      font-size: 12px;
    }
    #status { color: #aaa; }
    #status.connected { color: #4ade80; }
    #action-pane {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 220px;
      background: rgba(13, 13, 26, 0.94);
      border: 1px solid #334466;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      color: #aaa;
      display: none;
      z-index: 20;
    }
    #action-pane.open { display: block; }
    #ap-header {
      padding: 6px 8px 5px;
      color: #88aaff;
      font-weight: bold;
      border-bottom: 1px solid #223344;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #ap-close { color: #556677; cursor: pointer; font-size: 13px; line-height: 1; }
    #ap-close:hover { color: #aaa; }
    #ap-body {
      padding: 5px 8px 4px;
      line-height: 1.55;
      max-height: 130px;
      overflow-y: auto;
      border-bottom: 1px solid #1a2233;
    }
    #ap-move-hint {
      padding: 3px 8px;
      color: #ffaa44;
      font-size: 10px;
      border-bottom: 1px solid #1a2233;
    }
    #ap-actions {
      padding: 5px 8px 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .ap-btn {
      background: #111827;
      border: 1px solid #2a3a4a;
      border-radius: 3px;
      color: #8899aa;
      cursor: pointer;
      font-family: monospace;
      font-size: 10px;
      padding: 3px 7px;
      transition: all 0.1s;
    }
    .ap-btn:hover { border-color: #4a6a8a; color: #ccd; background: #1a2535; }
    .ap-btn.primary { border-color: #4ade80; color: #4ade80; }
    .ap-btn.primary:hover { background: #0d1f15; }
    #fs-btn, #vol-btn {
      color: #aaa;
      cursor: pointer;
      user-select: none;
      line-height: 1;
      font-size: 14px;
      opacity: 0.6;
      transition: opacity 0.15s;
    }
    #fs-btn:hover, #vol-btn:hover { opacity: 1; }
    #vol-btn.on { color: #4ade80; opacity: 0.85; }
    #station-select {
      display: none;
      background: #0d0d1a;
      border: 1px solid #333;
      border-radius: 3px;
      color: #aaa;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.15s;
      outline: none;
      padding: 2px 4px;
    }
    #station-select:hover { opacity: 1; color: #eee; }
    #station-select option { background: #0d0d1a; color: #eee; }
    #station-select.visible { display: block; }
    #vol-slider {
      display: none;
      width: 60px;
      height: 3px;
      accent-color: #4ade80;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.15s;
    }
    #vol-slider:hover { opacity: 1; }
    #vol-slider.visible { display: block; }
  </style>
</head>
<body>
  <div id="action-pane">
    <div id="ap-header">
      <span id="ap-title">Entity</span>
      <span id="ap-close" onclick="window._rp?._clearSelection()">✕</span>
    </div>
    <div id="ap-body"></div>
    <div id="ap-move-hint">📍 Click map to move</div>
    <div id="ap-actions"></div>
  </div>
  <div id="hud">
    <span id="vol-btn" title="Toggle music">🔇</span>
    <select id="station-select">
      <option value="edm"      data-src="https://ice5.somafm.com/thetrip-128-mp3">EDM • SomaFM The Trip</option>
      <option value="jazz"     data-src="https://ice5.somafm.com/secretagent-128-mp3">Jazz • SomaFM Secret Agent</option>
      <option value="hiphop"   data-src="https://ice5.somafm.com/fluid-128-mp3">Hip-Hop • SomaFM Fluid</option>
      <option value="medieval" data-src="http://play.radiorivendell.com/radio/8000/radio.mp3">Medieval • Radio Rivendell</option>
      <option value="reggae"   data-src="https://ice5.somafm.com/reggae-128-mp3">Reggae • SomaFM Reggae</option>
    </select>
    <input id="vol-slider" type="range" min="0" max="1" step="0.05" value="0.4" title="Volume" />
    <span id="fs-btn" title="Pop out to borderless window">⧉</span>
    <div id="status">● connecting...</div>
  </div>
  <script>
    const fsBtn = document.getElementById('fs-btn');
    const isPopup = new URLSearchParams(location.search).has('popup');

    if (isPopup) fsBtn.style.display = 'none';

    const volBtn       = document.getElementById('vol-btn');
    const volSlider    = document.getElementById('vol-slider');
    const stationSel   = document.getElementById('station-select');
    let bgm = null;

    // Restore preferences
    const savedVol = localStorage.getItem('clauderpg_volume');
    if (savedVol !== null) volSlider.value = savedVol;
    const savedStation = localStorage.getItem('clauderpg_station');
    if (savedStation) stationSel.value = savedStation;

    function streamUrl() {
      return stationSel.options[stationSel.selectedIndex].dataset.src;
    }

    volBtn.addEventListener('click', () => {
      if (bgm) {
        bgm.pause();
        bgm.src = '';
        bgm = null;
        volBtn.textContent = '🔇';
        volBtn.classList.remove('on');
        stationSel.classList.remove('visible');
        volSlider.classList.remove('visible');
      } else {
        bgm = new Audio(streamUrl());
        bgm.volume = parseFloat(volSlider.value);
        bgm.play().catch(() => {});
        volBtn.textContent = '🔊';
        volBtn.classList.add('on');
        stationSel.classList.add('visible');
        volSlider.classList.add('visible');
      }
    });

    stationSel.addEventListener('change', () => {
      localStorage.setItem('clauderpg_station', stationSel.value);
      if (bgm) {
        bgm.pause();
        bgm.src = streamUrl();
        bgm.load();
        bgm.play().catch(() => {});
      }
    });

    volSlider.addEventListener('input', () => {
      if (bgm) bgm.volume = parseFloat(volSlider.value);
      localStorage.setItem('clauderpg_volume', volSlider.value);
    });

    fsBtn.addEventListener('click', () => {
      const features = [
        `width=${window.outerWidth}`,
        `height=${window.outerHeight}`,
        `left=${window.screenX}`,
        `top=${window.screenY}`,
        'popup'
      ].join(',');
      window.open(location.pathname + '?popup=1', 'clauderpg-borderless', features);
    });
  </script>
  <script>document.addEventListener('contextmenu', e => e.preventDefault());</script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
